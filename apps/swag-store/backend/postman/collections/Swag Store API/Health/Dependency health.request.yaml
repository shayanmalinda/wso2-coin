$kind: http-request
description: 200 when every dependency is ok or not configured, 503 when one failed. Cached 10 s.
method: GET
url: '{{baseUrl}}/health/dependencies'
auth:
  type: noauth
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is one of 200, 503', () => pm.expect(pm.response.code).to.be.oneOf([200, 503]));
    const json = pm.response.json();
    const names = ['database', 'transactionService', 'treasury', 'hrEntity', 'email'];
    pm.test('Every dependency has a state', () => {
      names.forEach((name) => pm.expect(json[name], name).to.be.a('string').and.not.be.empty);
    });
    const failed = names.filter((name) => json[name] !== 'ok' && json[name] !== 'not_configured');
    pm.test('Status matches the states', () => pm.expect(pm.response.code).to.equal(failed.length ? 503 : 200));
  language: text/javascript
order: 2000
