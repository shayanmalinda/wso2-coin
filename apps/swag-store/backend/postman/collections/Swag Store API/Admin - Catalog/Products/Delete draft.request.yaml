$kind: http-request
description: Deletes the DRAFT from Create throwaway draft (204). Only a DRAFT that was never ordered can go; Delete active product shows the 409.
method: DELETE
url: '{{baseUrl}}/admin/products/:id'
pathVariables:
- key: id
  value: '{{draftProductId}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 204', () => pm.expect(pm.response.code).to.equal(204));
  language: text/javascript
order: 11000
