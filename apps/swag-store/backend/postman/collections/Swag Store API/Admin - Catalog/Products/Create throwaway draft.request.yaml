$kind: http-request
description: A second DRAFT that is never published or ordered, so Delete draft can show its 204.
method: POST
url: '{{baseUrl}}/admin/products'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "name": "WSO2 Sticker Sheet",
      "slug": "wso2-sticker-sheet-{{$timestamp}}",
      "categoryId": "{{categoryId}}",
      "price": 5,
      "restockPolicy": "LIMITED"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 201', () => pm.expect(pm.response.code).to.equal(201));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      pm.test('Product is a DRAFT', () => pm.expect(json.status).to.equal('DRAFT'));
      pm.collectionVariables.set('draftProductId', json.id);
    }
  language: text/javascript
order: 10500
