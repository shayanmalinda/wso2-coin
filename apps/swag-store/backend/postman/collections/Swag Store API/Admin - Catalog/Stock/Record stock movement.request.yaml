$kind: http-request
description: delta 1 to 100,000 for RECEIVE and WRITE_OFF (a write-off subtracts it); any non-zero value up to 100,000 either way for ADJUST. Receiving stock notifies pending alerts.
method: POST
url: '{{baseUrl}}/admin/variants/:id/stock-movements'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: id
  value: '{{adminVariantId}}'
body:
  type: json
  content: |-
    {
      "delta": 25,
      "reason": "RECEIVE",
      "note": "Supplier delivery"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 1000
