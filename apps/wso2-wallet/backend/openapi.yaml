openapi: 3.0.3
info:
  title: WSO2 Wallet Backend
  version: 1.0.0
  description: REST API for managing wallets, balances and transfers.
servers:
  - url: /
security:
  - jwtAssertion: []
paths:
  /health:
    get:
      summary: Service liveness
      security: []
      responses:
        "200":
          description: Service is up
  /api/v1/wallets:
    get:
      summary: List the wallets the caller owns, followed by the wallets shared with them
      responses:
        "200":
          description: Wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
    post:
      summary: Create a new wallet for the caller
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /api/v1/wallets/{address}/set-primary:
    post:
      summary: Set a wallet as the caller's default
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "204":
          description: Updated
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/balance:
    get:
      summary: Get a wallet's balance
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/transactions:
    get:
      summary: List a wallet's transactions, newest first
      parameters:
        - $ref: "#/components/parameters/Address"
        - name: limit
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: direction
          in: query
          schema:
            type: string
            enum: [sent, received]
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
  /api/v1/wallets/{address}/health:
    get:
      summary: Report a wallet's integrity
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletHealth"
  /api/v1/wallets/{address}/info:
    get:
      summary: What anyone may know about a wallet before sending to it
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/name:
    post:
      summary: Set or clear the wallet name (owner only; setting a non-empty name requires the wallet to be shared, clearing does not)
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "204":
          description: Name updated
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/access:
    get:
      summary: List the people the wallet is shared with (owner only)
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Access grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessGrant"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Give a person access, or change their access level (owner only)
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequest"
      responses:
        "204":
          description: Access granted
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/access/revoke:
    post:
      summary: Remove a person's access (owner only)
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "204":
          description: Access removed
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/wallets/{address}/access/leave:
    post:
      summary: Give up the caller's own access to a wallet shared with them
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "204":
          description: Access removed
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/transfers:
    post:
      summary: Transfer coins from a wallet the caller owns or has TRANSACT access to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transfer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/app-config:
    get:
      summary: Client-facing runtime configuration
      responses:
        "200":
          description: App configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
components:
  securitySchemes:
    jwtAssertion:
      type: apiKey
      in: header
      name: X-Jwt-Assertion
      description: Gateway-issued JWT assertion carrying the caller identity.
  parameters:
    Address:
      name: address
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AppConfig:
      type: object
      properties:
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string
    Wallet:
      type: object
      properties:
        address:
          type: string
        defaultWallet:
          type: boolean
        createdOn:
          type: string
        name:
          type: string
          description: Present only while the wallet is shared with at least one other person.
        role:
          $ref: "#/components/schemas/Role"
        shared:
          type: boolean
          description: Whether anyone other than the owner has access.
    Role:
      type: string
      enum: [OWNER, TRANSACT, READ]
    WalletInfo:
      type: object
      properties:
        address:
          type: string
        name:
          type: string
    RenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          description: An empty name clears it.
    AccessGrant:
      type: object
      properties:
        email:
          type: string
        accessLevel:
          type: string
          enum: [TRANSACT, READ]
        grantedBy:
          type: string
        grantedOn:
          type: string
    AccessRequest:
      type: object
      required: [email, accessLevel]
      properties:
        email:
          type: string
        accessLevel:
          type: string
          enum: [TRANSACT, READ]
    RevokeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    Balance:
      type: object
      properties:
        address:
          type: string
        balance:
          type: string
    Transaction:
      type: object
      properties:
        transactionHash:
          type: string
        fromAddress:
          type: string
        toAddress:
          type: string
        amount:
          type: string
        direction:
          type: string
          enum: [sent, received]
        timestamp:
          type: string
        initiatedBy:
          type: string
          description: Who made the transfer. Present only on transfers sent from the wallet.
    TransactionPage:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    TransferRequest:
      type: object
      required: [fromAddress, toAddress, amount]
      properties:
        fromAddress:
          type: string
        toAddress:
          type: string
        amount:
          type: string
    TransferResponse:
      type: object
      properties:
        transactionHash:
          type: string
    WalletHealth:
      type: object
      properties:
        healthy:
          type: boolean
        exists:
          type: boolean
        balanceIntact:
          type: boolean
    Error:
      type: object
      properties:
        message:
          type: string
